services:
  # FastAPI Python Backend Service with FFmpeg
  - type: web
    name: reel-studio-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: ENABLE_WHISPER
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false

  # React Frontend Static Site
  - type: web
    name: reel-studio-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reel-studio-backend
          property: host
